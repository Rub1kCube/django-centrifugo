name: Release
run-name: Release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version change (none = release the current version)"
        required: true
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != refs/heads/main ]]; then
            echo "::error::Releases must be run from main."
            exit 1
          fi

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- Compatible with actionlint 1.7.12.

  docs:
    needs: validate
    uses: ./.github/workflows/docs.yml # zizmor: ignore[self-repository] -- Compatible with actionlint 1.7.12.

  release:
    name: Create release
    needs: [checks, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: false
      - name: Prepare version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in
            none) ;;
            patch|minor|major) uv version --bump "$BUMP" --no-sync ;;
            *) echo "::error::Invalid version change: $BUMP"; exit 1 ;;
          esac
          version=$(uv version --short)
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "::error::Tag $tag already exists. Choose a version bump."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check lockfile
        run: uv lock --check
      - name: Build sdist and wheel
        run: uv build --no-sources
      - name: Save release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Commit version and push tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh auth setup-git
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::main changed during checks. Run the release again."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $TAG"
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.whl dist/*.tar.gz \
            --verify-tag --title "$TAG" --generate-notes

  publish:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/django-centrifugo/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/
      - name: Publish distributions
        run: |
          uv publish --trusted-publishing always --check-url https://pypi.org/simple/ \
            dist/*.whl dist/*.tar.gz
